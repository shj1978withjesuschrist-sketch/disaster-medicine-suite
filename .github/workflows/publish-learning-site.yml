name: Publish bilingual disaster medicine training
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public HTML release
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: public-site
          persist-credentials: false
      - name: Check the language entries and illustration set
        working-directory: public-site
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('curriculum.json').read_text(encoding='utf-8'))
          games = catalog['games']
          assert catalog['scope'] == 'full-catalog' and len(games) == 14
          assert len({g['folder'] for g in games}) == 14
          for lang in ('ko', 'en'):
              assert Path(lang, 'index.html').is_file()
              expected = {Path(lang, 'games', g['folder'], r['file']) for g in games for r in g['routes']}
              assert set(Path(lang, 'games').rglob('*.html')) == expected
              assert all(p.stat().st_size > 0 for p in expected)
          assert len(list(Path('media').glob('*.webp'))) == 14
          assert not list(Path('.').rglob('*.js'))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the learning site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
